<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig Preview</title>
<style>
  body { margin: 0; padding: 16px; background: #120d22; color: #e8e4f0; font: 14px sans-serif; }
  h1 { font-size: 18px; margin: 18px 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 12px; align-items: flex-end; }
  .cell { text-align: center; }
  canvas { image-rendering: pixelated; background: #2d4c35; display: block; margin-bottom: 4px; }
  .dim { color: #8a8098; font-size: 12px; }
  button { background: #2a1f45; color: #e8e4f0; border: 1px solid #4c3a86; padding: 4px 10px; cursor: pointer; }
  button.on { background: #4c3a86; }
</style>
</head>
<body>
<h1>居合の比較: カクカク版 / 滑らか版</h1>
<p class="dim">滑らか版 = 刀を毎フレーム任意の角度で描く + 振り抜きの光の弧(スミア) + 補間(イージング)した沈み込み・踏み込み + 全身の前傾と伸縮。どちらもドット単位で描いてから拡大している(ゲームと同じ)</p>
<div class="row">速度: <button data-s="1" class="on">1×</button><button data-s="0.5">0.5×</button><button data-s="0.25">0.25×</button></div>
<div class="row" id="cmp"></div>
<h1>滑らか版の途中経過(0.05秒ごと・5倍)</h1>
<div id="strip"></div>
<h1>その他のモーション</h1>
<div class="row" id="others"></div>
<h1>カクカク版の全フレーム(6倍)</h1>
<div id="sheets"></div>
<script>
// 編集した art.js が確実に反映されるよう、キャッシュを避けて読み込む
document.write('<script src="../js/art.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
'use strict';
// 部位アニメーションの確認用ページ(開発用)。ゲームには読み込まれない
const R = ART.S.samurai, PW = 44, PH = 30; // ドット単位の描画領域
const PAUSE = 0.7;

// ---------- 補間 ----------
const EASE = { lin: u => u, out: u => 1 - (1 - u) ** 3, in: u => u * u * u, inOut: u => (u < 0.5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2) };
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t0, v0] = keys[i - 1], [t1, v1, e] = keys[i];
    if (t <= t1) return v0 + (v1 - v0) * EASE[e || 'inOut']((t - t0) / (t1 - t0));
  }
  return keys[keys.length - 1][1];
}

// ---------- 滑らか版の居合(1.35秒) ----------
const SMOOTH_DUR = 1.35;
const K = {
  crouch: [[0, 0], [0.12, 1, 'out'], [0.35, 2, 'out'], [0.47, 2], [0.53, 0, 'out']],
  lunge:  [[0, 0], [0.47, 0], [0.53, 2, 'out'], [0.9, 2], [1.2, 0]],
  lean:   [[0, 0], [0.3, -0.06], [0.47, -0.08], [0.53, 0.16, 'out'], [0.8, 0.04], [1.2, 0]],
  sy:     [[0, 1], [0.35, 0.96, 'out'], [0.47, 0.95], [0.53, 1.04, 'out'], [0.65, 1]],
  // 刀の角度(0 = 右、負 = 上)。振り抜き → 残心 → 血振り(前下へ払う) → 納刀
  ang:    [[0.47, 0.7], [0.55, -2.1, 'out'], [0.85, -1.95], [1.02, -2.25], [1.12, 0.9, 'inOut']],
};
const BLADE_END = 1.16; // 刀を描く最後の時刻(以降は鞘に収まって柄が光る)
// 手前の腕の絵ごとの手の位置(体の枠の座標。部位の原点 10,8 + 絵の中の手)
const HAND = { slash: [15, 9.5], high: [13, 8.5], grip: [11, 10.5] };
const BLADE_LEN = 11;

function smoothState(t) {
  const crouch = track(K.crouch, t), lunge = track(K.lunge, t);
  const L = Math.round(lunge), U = Math.round(crouch) + (lunge > 0.5 ? 1 : 0);
  const bladeOn = t >= 0.47 && t < BLADE_END, ang = track(K.ang, t);
  const arm = t < 0.05 ? 'base' : t < 0.47 ? 'grip' : t < BLADE_END ? (ang > -0.8 ? 'slash' : 'high') : t < 1.25 ? 'grip' : 'base';
  const armDy = arm === 'high' ? -2 : 0;
  const legs = crouch >= 1.5 ? [0, 2, 'crouch'] : crouch >= 0.5 ? [0, 1, 'crouch'] : lunge > 0.5 ? [0, 0, 'stepA'] : [0, 0];
  const sheathV = bladeOn ? 'empty' : (t > 0.35 && t < 0.47) || (t > BLADE_END && t < 1.3) ? 'glint' : 'base';
  const headV = t > 0.47 && t < 0.9 && Math.floor(t * 12) % 2 ? 'b' : 'base';
  const p = { head: [L, U, headV], torso: [L, U], backArm: [L, U], sheath: [L, U, sheathV], legs };
  if (arm !== 'base') p.frontArm = [L, U + armDy, arm]; else p.frontArm = [L, U];
  const hand = arm !== 'base' && HAND[arm] ? [HAND[arm][0] + L, HAND[arm][1] + U + armDy] : null;
  return { p, hand, bladeOn, ang, lean: track(K.lean, t), sy: track(K.sy, t) };
}

// ドット単位のキャンバスに描く(pc: PW×PH のキャンバス、gc: 光る部分)
function drawSmooth(pc, gc, t, hist) {
  const s = smoothState(t), sp = R.pose(s.p);
  const fx = Math.round(PW / 2), fy = PH - 3;                   // 足元の基準点
  const ax = sp.w / 2, ay = sp.h - 1;                            // スプライト内の足元
  const toScreen = (x, y) => { const rx = x - ax, ry = y - ay; return [fx + rx - s.lean * ry, fy + s.sy * ry]; };
  for (const [c, img] of [[pc, sp.c], [gc, sp.e]]) {
    if (!img) continue;
    c.save(); c.imageSmoothingEnabled = false;
    c.setTransform(1, 0, -s.lean, s.sy, fx, fy);
    c.drawImage(img, -ax, -ay);
    c.restore();
  }
  if (!s.bladeOn || !s.hand) { hist.length = 0; return; }
  const [hx, hy] = toScreen(1 + R.padX + s.hand[0], 1 + s.hand[1]);
  // 振り抜きの光の弧(直近 0.07 秒の角度の範囲)
  hist.push({ t, a: s.ang }); while (hist.length && t - hist[0].t > 0.07) hist.shift();
  const a0 = Math.min(...hist.map(h => h.a)), a1 = Math.max(...hist.map(h => h.a));
  if (a1 - a0 > 0.25) {
    for (let y = -BLADE_LEN - 1; y <= BLADE_LEN + 1; y++) for (let x = -BLADE_LEN - 1; x <= BLADE_LEN + 1; x++) {
      const d = Math.hypot(x, y); if (d < 3 || d > BLADE_LEN + 0.5) continue;
      const a = Math.atan2(y, x);
      let best = 9; for (const k of [-2, 0, 2]) { const aa = a + k * Math.PI; if (aa >= a0 && aa <= a1) best = Math.min(best, Math.abs(aa - s.ang)); }
      if (best > 8) continue;
      const alpha = 0.6 * (1 - best / (a1 - a0 + 0.01)) * (d / BLADE_LEN);
      for (const c of [pc, gc]) { c.globalAlpha = alpha; c.fillStyle = '#eaf4ff'; c.fillRect(Math.round(hx + x), Math.round(hy + y), 1, 1); }
    }
    pc.globalAlpha = gc.globalAlpha = 1;
  }
  // 刀身: 手元から角度方向へ1ドットずつ(柄は金)
  const seen = new Set();
  for (let i = 0; i <= BLADE_LEN; i++) {
    const x = Math.round(hx + Math.cos(s.ang) * i), y = Math.round(hy + Math.sin(s.ang) * i), k = x + ',' + y;
    if (seen.has(k)) continue; seen.add(k);
    pc.fillStyle = i < 2 ? '#d6ae5c' : '#eaf4ff'; pc.fillRect(x, y, 1, 1);
    if (i >= 2) { gc.fillStyle = '#eaf4ff'; gc.fillRect(x, y, 1, 1); }
  }
}
// カクカク版(今の居合)
function drawChoppy(pc, gc, t) {
  const sp = ART.rigFrame(R, 'iai', t);
  const x = Math.round(PW / 2 - sp.w / 2), y = PH - 3 - (sp.h - 1);
  pc.drawImage(sp.c, x, y); if (sp.e) gc.drawImage(sp.e, x, y);
}

// ---------- 表示 ----------
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const px = mkCanvas(PW, PH), pctx = px.getContext('2d'), gl = mkCanvas(PW, PH), gctx = gl.getContext('2d');
function present(dst, sc, dx = 0) {
  const x = dst.getContext('2d'); x.imageSmoothingEnabled = false;
  x.drawImage(px, dx, 0, PW * sc, PH * sc);
  x.save(); x.globalCompositeOperation = 'lighter'; x.filter = `blur(${sc}px)`; x.globalAlpha = 0.9; x.drawImage(gl, dx, 0, PW * sc, PH * sc); x.restore();
}
function paint(fn) { pctx.clearRect(0, 0, PW, PH); gctx.clearRect(0, 0, PW, PH); fn(); }

let speed = 1;
for (const b of document.querySelectorAll('button[data-s]')) b.onclick = () => { speed = +b.dataset.s; document.querySelectorAll('button[data-s]').forEach(x => x.classList.toggle('on', x === b)); };

const cmp = [];
for (const [label, kind, sc] of [['カクカク版(8倍)', 'choppy', 8], ['滑らか版(8倍)', 'smooth', 8], ['カクカク版(3倍)', 'choppy', 3], ['滑らか版(3倍)', 'smooth', 3]]) {
  const c = mkCanvas(PW * sc, PH * sc), cell = document.createElement('div'); cell.className = 'cell';
  cell.append(c, Object.assign(document.createElement('div'), { textContent: label }));
  document.getElementById('cmp').append(cell);
  cmp.push({ c, kind, sc, hist: [] });
}
const others = [];
for (const m of ['idle', 'walk']) {
  const c = mkCanvas(PW * 4, PH * 4), cell = document.createElement('div'); cell.className = 'cell';
  cell.append(c, Object.assign(document.createElement('div'), { textContent: m + '(4倍)' }));
  document.getElementById('others').append(cell);
  others.push({ c, m });
}

// 滑らか版の途中経過
{
  const sc = 5, times = []; for (let t = 0.3; t <= 1.3001; t += 0.05) times.push(+t.toFixed(2));
  const c = mkCanvas(times.length * PW * sc, PH * sc + 16), x = c.getContext('2d');
  const hist = [];
  // 弧の履歴を作るため、細かい刻みで進めながら該当時刻を切り出す
  let ti = 0;
  for (let t = 0; t <= 1.3001 && ti < times.length; t += 1 / 120) {
    if (Math.abs(t - times[ti]) < 1 / 240) {
      paint(() => drawSmooth(pctx, gctx, t, hist)); present(c, sc, ti * PW * sc);
      x.fillStyle = '#e8e4f0'; x.font = '11px sans-serif'; x.fillText(times[ti] + 's', ti * PW * sc + 4, PH * sc + 12);
      ti++;
    } else { smoothState(t); const h = smoothState(t); if (h.bladeOn) { hist.push({ t, a: h.ang }); while (t - hist[0].t > 0.07) hist.shift(); } else hist.length = 0; }
  }
  document.getElementById('strip').append(c);
}

// カクカク版の全フレーム
for (const m in R.motions) {
  const fr = R.motions[m].frames, sc = 6, fw = R.base.w + 2;
  const c = mkCanvas(fr.length * fw * sc, 22 * sc), x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  fr.forEach((f, i) => {
    x.drawImage(f.sp.c, i * fw * sc + sc, sc, f.sp.w * sc, f.sp.h * sc);
    x.fillStyle = '#e8e4f0'; x.font = '12px sans-serif'; x.fillText(`${i} (${f.t}s)`, i * fw * sc + 4, c.height - 4);
  });
  const cell = document.createElement('div'); cell.className = 'cell';
  cell.append(Object.assign(document.createElement('div'), { textContent: m }), c);
  document.getElementById('sheets').append(cell);
}

let clock = 0, last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; clock += dt * speed;
  for (const v of cmp) {
    const dur = v.kind === 'smooth' ? SMOOTH_DUR : R.motions.iai.dur, t = clock % (dur + PAUSE);
    v.c.getContext('2d').clearRect(0, 0, v.c.width, v.c.height);
    paint(() => v.kind === 'smooth' ? drawSmooth(pctx, gctx, Math.min(t, dur), v.hist) : drawChoppy(pctx, gctx, Math.min(t, dur - 1e-6)));
    present(v.c, v.sc);
  }
  for (const v of others) {
    v.c.getContext('2d').clearRect(0, 0, v.c.width, v.c.height);
    paint(() => { const sp = ART.rigFrame(R, v.m, clock); const x = Math.round(PW / 2 - sp.w / 2), y = PH - 3 - (sp.h - 1); pctx.drawImage(sp.c, x, y); if (sp.e) gctx.drawImage(sp.e, x, y); });
    present(v.c, 4);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig Preview</title>
<style>
  body { margin: 0; padding: 16px; background: #120d22; color: #e8e4f0; font: 14px sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
  .cell { text-align: center; }
  canvas { image-rendering: pixelated; background: #2d4c35; display: block; margin-bottom: 4px; }
  .dim { color: #8a8098; font-size: 12px; }
</style>
</head>
<body>
<h1>部位アニメーション試作(サムライ 16×18)</h1>
<p class="dim">上段: 8倍 / 下段: ゲーム内の見た目に近い 3倍(草原の上)。「旧」は今のプレイヤー(12×13)</p>
<div class="row" id="big"></div>
<div class="row" id="small"></div>
<h1>全フレーム(6倍)</h1>
<div id="sheets"></div>
<script>
// 編集した art.js が確実に反映されるよう、キャッシュを避けて読み込む
document.write('<script src="../js/art.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
'use strict';
// 部位アニメーションの確認用ページ(開発用)。ゲームには読み込まれない
const R = ART.S.samurai;
const items = [
  { label: '旧 (静止)', sp: () => ART.S.player },
  ...Object.keys(R.motions).map(m => ({ label: m, sp: t => ART.rigFrame(R, m, R.motions[m].loop ? t : t % (R.motions[m].dur + 0.6)) })),
];
const views = [];
for (const [host, sc] of [['big', 8], ['small', 3]]) {
  for (const it of items) {
    const cell = document.createElement('div'); cell.className = 'cell';
    const c = document.createElement('canvas'); c.width = 22 * sc; c.height = 24 * sc;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    cell.append(c, Object.assign(document.createElement('div'), { textContent: it.label }));
    document.getElementById(host).append(cell);
    views.push({ x, c, sc, it });
  }
}
// 各モーションの全フレームを横に並べる(動きの確認用)
for (const m in R.motions) {
  const fr = R.motions[m].frames, sc = 6;
  const c = document.createElement('canvas'); c.width = fr.length * 20 * sc; c.height = 22 * sc;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  fr.forEach((f, i) => {
    x.drawImage(f.sp.c, i * 20 * sc + sc, sc, f.sp.w * sc, f.sp.h * sc);
    x.fillStyle = '#e8e4f0'; x.font = '12px sans-serif'; x.fillText(`${i} (${f.t}s)`, i * 20 * sc + 4, c.height - 4);
  });
  const cell = document.createElement('div'); cell.className = 'cell';
  cell.append(Object.assign(document.createElement('div'), { textContent: m }), c);
  document.getElementById('sheets').append(cell);
}
function frame(ts) {
  const t = ts / 1000;
  for (const v of views) {
    const sp = v.it.sp(t), { x, c, sc } = v;
    x.clearRect(0, 0, c.width, c.height);
    const dx = Math.round((c.width - sp.w * sc) / 2), dy = c.height - (sp.h + 2) * sc;
    x.fillStyle = 'rgba(0,0,0,.35)';
    x.beginPath(); x.ellipse(c.width / 2, dy + sp.h * sc - sc, 5 * sc, 1.5 * sc, 0, 0, Math.PI * 2); x.fill();
    x.drawImage(sp.c, dx, dy, sp.w * sc, sp.h * sc);
    if (sp.e) { x.save(); x.globalCompositeOperation = 'lighter'; x.shadowColor = '#ffffff'; x.shadowBlur = 3 * sc; x.globalAlpha = 0.8; x.drawImage(sp.e, dx, dy, sp.w * sc, sp.h * sc); x.restore(); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

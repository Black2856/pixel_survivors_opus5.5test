<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PIXEL SURVIVORS: NOCTURNE</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="xpbar"><div id="xpfill"></div><div id="lvl">LV 1</div></div>
    <div id="hud-top">
      <div id="slotbox"><div id="wslots"></div><div id="pslots"></div><div id="aslots"></div></div>
      <div id="timebox"><div id="timer">00:00</div><div id="stage-name"></div><div id="elv"><span id="elv-n">ENEMY LV 1</span><div id="elv-bar"><div id="elv-fill"></div></div></div></div>
      <div id="counters"><div id="dmgtotal"></div><div id="kills"></div><div id="gold"></div></div>
    </div>
    <div id="combo"><div id="combo-n">0</div><div class="combo-lbl">COMBO</div><div id="combo-bar"><div id="combo-fill"></div></div></div>
    <div id="bossbar" class="hidden">
      <div id="bossname"></div>
      <div class="track"><div id="bossfill-lag"></div><div id="bossfill"></div></div>
    </div>
  </div>

  <div id="announce"></div>
  <div id="banner"></div>

  <div id="title-screen" class="screen">
    <div class="title-wrap">
      <div class="logo"><span class="l1">PIXEL</span><span class="l2">SURVIVORS</span><span class="l3">— NOCTURNE —</span></div>
      <div class="menu">
        <button id="btn-start" class="btn big">▶ START</button>
        <button id="btn-arena" class="btn arena">⚔ 闘技場 <small>BOSS RUSH</small></button>
        <button id="btn-shop" class="btn">永続強化</button>
        <button id="btn-settings" class="btn ghost">設定</button>
      </div>
      <div id="title-gold" class="gold-chip"></div>
      <div id="title-best" class="best"></div>
      <div class="howto">WASD / 矢印 移動 ・ SPACE ダッシュ(無敵) ・ 攻撃は自動(SHIFT でマウス照準切替) ・ ESC ポーズ ・ M ミュート</div>
    </div>
  </div>

  <div id="shop-screen" class="screen hidden">
    <h2 class="scr-title">永続強化</h2>
    <div id="shop-gold" class="gold-chip"></div>
    <div id="shop-list"></div>
    <div class="menu row"><button id="btn-shop-reset" class="btn ghost">リセット(全額返金)</button><button id="btn-shop-back" class="btn">戻る</button></div>
  </div>

  <div id="choice-screen" class="screen hidden">
    <h2 id="choice-title" class="scr-title">LEVEL UP!</h2>
    <div id="cards"></div>
    <div id="choice-btns"></div>
    <div class="hint">クリック / 1〜3 キーで選択 ・ R でリロール</div>
  </div>

  <div id="chest-screen" class="screen hidden">
    <div class="beams"></div><div class="beams b2"></div>
    <canvas id="chest-fx"></canvas>
    <div id="chest-tier"></div>
    <div id="chest-stage"><div id="chest-aura"></div><img id="chest-img" alt=""></div>
    <div id="chest-rewards"></div>
    <div id="chest-gold"></div>
    <div id="chest-hint" class="hint"></div>
    <button id="chest-ok" class="btn big hidden">OK (SPACE)</button>
    <div id="chest-flash"></div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <h2 class="scr-title">PAUSED</h2>
    <div id="pause-build"></div>
    <div id="settings-panel">
      <div class="vol"><label>音楽</label><input type="range" id="vol-music" min="0" max="100"></div>
      <div class="vol"><label>効果音</label><input type="range" id="vol-sfx" min="0" max="100"></div>
      <div class="vol"><label>画質</label><div class="seg" id="set-gfx"><button data-v="high">高</button><button data-v="mid">中</button><button data-v="low">低</button></div></div>
      <div class="vol"><label>攻撃の濃さ</label><input type="range" id="set-fxa" min="15" max="100"><span id="set-fxa-n" class="set-n"></span></div>
      <div class="set-note">画質: 低いほどブルーム・画面の歪み・パーティクルを減らし軽くなります<br>攻撃の濃さ: 自分の攻撃エフェクトの不透明度(敵の攻撃は常にくっきり表示)</div>
    </div>
    <div class="menu">
      <button id="btn-resume" class="btn">再開 (ESC)</button>
      <button id="btn-quit" class="btn ghost">あきらめる</button>
    </div>
  </div>

  <div id="settings-screen" class="screen hidden">
    <h2 class="scr-title">設定</h2>
    <div id="settings-slot"></div>
    <div class="menu"><button id="btn-set-back" class="btn">戻る</button></div>
  </div>

  <div id="result-screen" class="screen hidden">
    <h2 id="result-title">YOU DIED</h2>
    <div class="result-body">
      <div id="result-stats"></div>
      <div id="result-dmg"></div>
    </div>
    <div class="menu row">
      <button id="btn-endless" class="btn big hidden">ENDLESS (Enter)</button>
      <button id="btn-retry" class="btn">RETRY (R)</button>
      <button id="btn-totitle" class="btn ghost">タイトルへ</button>
    </div>
  </div>

  <div id="tooltip" class="hidden"></div>
</div>

<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/gfx.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>

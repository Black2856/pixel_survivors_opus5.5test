# release に push すると、ビルド(npm run build → dist/)して GitHub Pages に出す
#   リポジトリの設定: Settings → Pages → Source を「GitHub Actions」に(2026-10-15 に release ブランチの直下から切り替えた)
#   手で出し直すときは Actions の画面から「Run workflow」(workflow_dispatch)
name: Deploy Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
